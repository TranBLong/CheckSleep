<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | DrowsyGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  </head>
  <body>
    <main class="site-shell narrow">
      <header class="site-header"><a href="/">DrowsyGuard</a></header>
      <section class="site-card">
        <h1>Đăng nhập</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}
        {% endwith %}
        <form method="post">
          <label>Tên đăng nhập<input name="username" autocomplete="username" required></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Đăng nhập</button>
        </form>
        <p>Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký Driver</a></p>
      </section>
    </main>
  </body>
</html>
